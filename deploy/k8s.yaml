# FireScope 3D on the workshop cluster (pattern from vast-builders-challenge deploy-app-no-registry).
# Render with:  NS=team-23 APP_HOST=video-lab-team-23.cosmos.vastdata.com envsubst < deploy/k8s.yaml | kubectl apply -f -
# ConfigMaps first (see deploy/README.md):
#   kubectl -n $NS create configmap firescope-code --from-file=deploy/out/code/firescope --from-file=deploy/out/code/requirements.txt --from-file=deploy/out/code/start.sh
#   kubectl -n $NS create configmap firescope-web  --from-file=deploy/out/web.tgz
#   kubectl -n $NS create configmap firescope-data --from-file=deploy/out/data.tgz
#   kubectl -n $NS create configmap firescope-thumbs --from-file=deploy/out/thumbs.tgz
#   kubectl -n $NS create secret generic firescope-env --from-literal=COSMOS_REASON_BASE=... --from-literal=COSMOS_API_KEY=... --from-literal=MEDIA_URL=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firescope
  labels: { app: firescope }
spec:
  replicas: 1
  selector: { matchLabels: { app: firescope } }
  template:
    metadata: { labels: { app: firescope } }
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh", "/app/start.sh"]
          env:
            - { name: PORT, value: "8080" }
            - { name: COSMOS_REASON_MODEL, value: "nvidia/cosmos3-nano-reasoner" }
            - { name: LLM_MODEL, value: "nvidia/cosmos3-nano-reasoner" }
          envFrom:
            - secretRef: { name: firescope-env, optional: true }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 5 }
          volumeMounts:
            - { name: appdir, mountPath: /app }
            - { name: web, mountPath: /bundle/web }
            - { name: data, mountPath: /bundle/data }
            - { name: thumbs, mountPath: /bundle/thumbs }
      initContainers:
        - name: layout
          image: python:3.12-slim
          command: ["sh", "-c", "mkdir -p /work/firescope && cp /src/*.py /work/firescope/ && cp /src/requirements.txt /src/start.sh /work/"]
          volumeMounts:
            - { name: code, mountPath: /src }
            - { name: appdir, mountPath: /work }
      volumes:
        - { name: code, configMap: { name: firescope-code } }
        - { name: web, configMap: { name: firescope-web } }
        - { name: data, configMap: { name: firescope-data } }
        - { name: thumbs, configMap: { name: firescope-thumbs, optional: true } }
        - { name: appdir, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: firescope }
spec:
  selector: { app: firescope }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firescope
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  ingressClassName: nginx
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: firescope, port: { number: 80 } } }
